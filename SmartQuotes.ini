[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
CodePage=65001
; Initialize shows local cache/favorites immediately; delayed GetQuote may quietly refresh batch
OnRefreshAction=[!CommandMeasure MeasureScript "Initialize()"][!Delay 500][!CommandMeasure MeasureScript "GetQuote()"]

[Metadata]
Name=Smart Quotes
Author=Stelliro
Version=1.2.1
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Information=Interactive Rainmeter quote widget with ZenQuotes batch cache (5 req/30s safe), local favorites, double-click rotate, custom entry, and dynamic scaling.

[Variables]
FontMain=Palatino Linotype
FontItalic=Palatino Linotype Italic
ColorQuote=255,255,255,235
ColorAuthor=255,255,255,160

; --- SCALING VARIABLES ---
Scale=0.8
BaseWidth=600
Width=(#BaseWidth#*#Scale#)

; --- Defaults ---
; RecycleFrequency: 1 = Always Favs, 4 = Every 4th quote is Fav, 0 = cache only
RecycleFrequency=16
; Auto-rotate interval in seconds (900 = 15 min). Rotation uses local cache — not a new API hit each time.
CurrentTimer=900
; ZenQuotes free tier: 5 requests / 30s / IP. Prefer /api/quotes (batch ~50) over /api/random.
; Docs: https://docs.zenquotes.io/zenquotes-documentation/#use-limits
URL=https://zenquotes.io/api/quotes
; Minimum seconds between any two API calls (keep >= 8; default 10 ≈ max 3 / 30s)
MinApiInterval=10
; Seconds before a successful batch is considered stale and may re-fetch (default 45 min)
CacheTtl=2700
; Set when last batch was saved (unix time); managed by logic.lua
CacheFetchedAt=0
; 1 = also mirror debug.log lines into Rainmeter's About → Log
DebugMode=0
TempQuote=""
TempAuthor=""
MenuState=0

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureScript]
Measure=Script
ScriptFile=logic.lua

[MeasureDebugLabel]
Measure=Calc
Formula=#DebugMode#
Substitute="0":"OFF","1":"ON"
DynamicVariables=1

[MeasureScale]
Measure=Calc
Formula=#Scale#
DynamicVariables=1
OnUpdateAction=[!SetVariable Width "(#BaseWidth#*#Scale#)"]

[MeasureInputSearch]
Measure=Plugin
Plugin=InputText
X=(20*#Scale#)
Y=(145*#Scale#)
W=(250*#Scale#)
H=(25*#Scale#)
FontSize=(11*#Scale#)
FontColor=255,255,255,255
SolidColor=50,50,50,255
FocusDismiss=1
Command1=[!CommandMeasure MeasureScript "ApplySearch('$UserInput$')"]
DynamicVariables=1

[MeasureInputNumeric]
Measure=Plugin
Plugin=InputText
FontSize=(11*#Scale#)
FontColor=255,255,255,255
SolidColor=50,50,50,255
FocusDismiss=1
InputNumber=1
DynamicVariables=1
Command1=[!CommandMeasure MeasureScript "SetTimerInput('$UserInput$')"] X=[MeterTimerBG:X] Y=[MeterTimerBG:Y] W=[MeterTimerBG:W] H=[MeterTimerBG:H]
Command2=[!CommandMeasure MeasureScript "SetFreqInput('$UserInput$')"] X=[MeterFreqBG:X] Y=[MeterFreqBG:Y] W=[MeterFreqBG:W] H=[MeterFreqBG:H]

[MeasureInputWeb]
Measure=Plugin
Plugin=InputText
; Overlay the favorites search bar when globe is clicked (author / topic query)
X=(20*#Scale#)
Y=(130*#Scale#)
W=(#Width#-(125*#Scale#))
H=(30*#Scale#)
FontSize=(11*#Scale#)
FontColor=255,255,255,255
SolidColor=50,50,50,255
FocusDismiss=1
Command1=[!CommandMeasure MeasureScript "WebSearch('$UserInput$')"]
DynamicVariables=1

; --- ADD QUOTE INPUTS ---

[MeasureInputNewQuote]
Measure=Plugin
Plugin=InputText
X=(20*#Scale#)
Y=(75*#Scale#)
W=(#Width#-(40*#Scale#))
H=(140*#Scale#)
FontSize=(11*#Scale#)
FontColor=255,255,255,255
SolidColor=50,50,50,255
FocusDismiss=0
DefaultValue="#TempQuote#"
DynamicVariables=1
WordWrap=1
TopPosition=1
Command1=[!SetVariable TempQuote "$UserInput$"][!UpdateMeter MeterInputQuoteBox][!Redraw]

[MeasureInputNewAuthor]
Measure=Plugin
Plugin=InputText
X=(20*#Scale#)
Y=(250*#Scale#)
W=(#Width#-(130*#Scale#))
H=(35*#Scale#)
FontSize=(11*#Scale#)
FontColor=255,255,255,255
SolidColor=50,50,50,255
FocusDismiss=0
DefaultValue="#TempAuthor#"
DynamicVariables=1
Command1=[!SetVariable TempAuthor "$UserInput$"][!UpdateMeter MeterInputAuthorBox][!Redraw]

[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % #CurrentTimer#) + 1
IfEqualValue=#CurrentTimer#
IfEqualAction=[!CommandMeasure MeasureScript "GetQuote()"]

; Minutes display for settings (CurrentTimer is stored in seconds)
[MeasureTimerMinutes]
Measure=Calc
Formula=#CurrentTimer# / 60
DynamicVariables=1

[MeasureSite]
Measure=WebParser
URL=#URL#
; Full body capture — StringIndex is required for GetStringValue()
RegExp=(?si)^(.*)$
StringIndex=1
; Manual updates only (script calls Update). Avoid ForceReload thrash/hangs.
UpdateRate=-1
ForceReload=0
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) SmartQuotes/1.2
FinishAction=[!CommandMeasure MeasureScript "OnWebUpdate()"]
OnConnectError=[!CommandMeasure MeasureScript "OnWebError('connect')"]
OnDownloadError=[!CommandMeasure MeasureScript "OnWebError('download')"]
OnRegExpError=[!CommandMeasure MeasureScript "OnWebError('regexp')"]

